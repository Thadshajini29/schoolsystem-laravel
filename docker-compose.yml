services:
  # PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: schoolsystem-app:latest
    container_name: school_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_NAME: "School Management System"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: schoolsystem_laravel
      DB_USERNAME: school_user
      DB_PASSWORD: school_password_123
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
    volumes:
      - storage_public:/var/www/storage/app/public
    networks:
      - school_net
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: school_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_public:/var/www/public/storage:ro
    networks:
      - school_net
    depends_on:
      - app

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: school_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: schoolsystem_laravel
      MYSQL_USER: school_user
      MYSQL_PASSWORD: school_password_123
      MYSQL_ROOT_PASSWORD: root_secure_password_999
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - school_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password_999"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Background Queue Worker
  queue:
    image: schoolsystem-app:latest
    container_name: school_queue
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_NAME: "School Management System"
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: schoolsystem_laravel
      DB_USERNAME: school_user
      DB_PASSWORD: school_password_123
      QUEUE_CONNECTION: database
    networks:
      - school_net
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

networks:
  school_net:
    driver: bridge

volumes:
  db_data:
    driver: local
  storage_public:
    driver: local
